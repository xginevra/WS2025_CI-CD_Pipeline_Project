<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colorful Gradient Page</title>
  <style>
    :root {
      --bg-start: #0f1020;
      --bg-end: #2e1a9e;
      --card: rgba(255, 255, 255, 0.85);
      --text: #1b1b1b;
      --accent: #6ee7b7;
    }

    /* Full-page gradient background */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #0f1020 0%, #2b1e57 50%, #0a2a5d 100%);
    }

    /* Subtle animated gradient overlay for depth (optional) */
    .background-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 20% 20%, rgba(110,231,183,0.25), transparent 40%),
                  radial-gradient(circle at 80% 60%, rgba(99,102,241,0.25), transparent 40%);
      mix-blend-mode: screen;
      filter: blur(1px);
    }

    /* Centered content card */
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 2rem 2.5rem;
      max-width: 720px;
      width: min(90vw, 720px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      text-align: center;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 2rem;
      letter-spacing: .5px;
      color: #111;
    }

    p {
      margin: 0 0 1.5rem;
      line-height: 1.6;
      color: #333;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
      border: 0;
      cursor: pointer;
      background: linear-gradient(135deg, #6ee7b7, #3b82f6);
      color: white;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 6px 14px rgba(59,130,246,0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(59,130,246,0.5);
    }

    .footnote {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #555;
    }

    @media (max-width: 480px) {
      .card { padding: 1.5rem; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="background-glow" aria-hidden="true"></div>

  <main class="card" role="main" aria-label="Colorful gradient example">
    <h1>Simple. </h1>
    <p>Hi! welcome to the colorful life. It is always a pleasure.
    </p>
    <a class="cta" href="#" role="button">Learn More</a>
    <div class="footnote" aria-hidden="true">Gradient inspired by soft, harmonious color blends.</div>
  </main>
</body>
</html>
