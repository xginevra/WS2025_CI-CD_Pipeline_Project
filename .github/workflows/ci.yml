name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies + tools
        run: |
          npm ci
          npm install -g pa11y lychee

      - name: 1️⃣ Linting (ESLint + Prettier)
        run: npm run lint

      - name: 2️⃣ Accessibility (pa11y WCAG AA)
        run: |
          pa11y --standard WCAG2AA \
            "file://$(pwd)/index.html" \
            "file://$(pwd)/about.html" \
            "file://$(pwd)/projects.html" \
            "file://$(pwd)/book.html"

      - name: Serve static files for Lighthouse
        uses: peaceiris/actions-http-server@v1
        with:
          port: 8080
          args: '.'

      - name: 3️⃣ Performance (Lighthouse)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/index.html
            http://localhost:8080/book.html

      - name: 4️⃣ Link checker (lychee)
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress './**/*.html'
