name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies + tools
        run: |
          npm install
          npm install -g pa11y lychee

      - name: 1️⃣ Linting (ESLint + Prettier)
        run: npm run lint

      - name: 2️⃣ Accessibility (pa11y WCAG AA)
        run: |
          pa11y --standard WCAG2AA \
            index.html \
            about.html \
            projects.html \
            book.html

      - name: 3️⃣ Performance (Lighthouse)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            index.html
            book.html

      - name: 4️⃣ Link checker (lychee)
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress './**/*.html'
