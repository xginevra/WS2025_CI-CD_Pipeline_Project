name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies + tools
        run: |
          npm ci
          npm install -g pa11y lychee lighthouse

      - name: List HTML files (debug)
        run: find . -name "*.html" -type f || echo "No HTML files found"

      - name: 1️⃣ Linting (ESLint + Prettier)
        run: npm run lint

      - name: 2️⃣ Python server + pa11y + Lighthouse
        run: |
          python3 -m http.server 8080 &
          SERVER_PID=$!
          sleep 5
          pa11y --standard WCAG2AA \
            http://localhost:8080/index.html \
            http://localhost:8080/about.html \
            http://localhost:8080/projects.html \
            http://localhost:8080/book.html
          lighthouse http://localhost:8080/index.html http://localhost:8080/book.html \
            --output html \
            --output-path ./lighthouse-report.html \
            --only-categories=performance,accessibility,seo \
            --chrome-flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions"
          kill $SERVER_PID || true
        continue-on-error: true

      - name: 3️⃣ Unit tests (Jest)
        run: npm test

      - name: 4️⃣ Link checker (lychee)
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress './**/*.html'

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.html
