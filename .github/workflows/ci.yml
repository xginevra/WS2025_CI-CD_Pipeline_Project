name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies + tools
        run: |
          npm ci
          npm install -g pa11y lychee lighthouse

      - name: 1️⃣ Linting (ESLint + Prettier)
        run: npm run lint

      - name: 2️⃣ Accessibility (pa11y WCAG AA)
        run: |
          pa11y --standard WCAG2AA \
            "file://$(pwd)/index.html" \
            "file://$(pwd)/about.html" \
            "file://$(pwd)/projects.html" \
            "file://$(pwd)/book.html"

      - name: 3️⃣ Performance (Lighthouse)
        run: |
          lighthouse \
            "file://$(pwd)/index.html" \
            "file://$(pwd)/book.html" \
            --output html \
            --output-path ./lighthouse-report.html \
            --only-categories=performance,accessibility,seo \
            --screen-sizes=1920x1080 \
            --chrome-flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage"
        continue-on-error: true

      - name: 4️⃣ Link checker (lychee)
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress './**/*.html'
