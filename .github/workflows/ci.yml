name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: 1️⃣ Linting (ESLint + Prettier)
        run: npm run lint

      - name: 2️⃣ Accessibility (Pa11y WCAG AA)
        uses: pa11y/action@v1
        with:
          args: |
            --standard WCAG2AA 
            index.html 
            about.html 
            projects.html 
            book.html

      - name: 3️⃣ Performance (Lighthouse)
        uses: lighthouse-actions/lighthouse@v2
        with:
          urls: |
            index.html
            book.html

      - name: 4️⃣ Link checker (Lychee)
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress './**/*.html'
