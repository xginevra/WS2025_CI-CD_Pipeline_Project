name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies + tools
        run: |
          npm ci
          npm install -g pa11y lychee lighthouse

      - name: 1️⃣ Linting (ESLint + Prettier)
        run: npm run lint

      - name: 2️⃣ Accessibility (pa11y WCAG AA)
        run: |
          pa11y --standard WCAG2AA \
            "file://$(pwd)/index.html" \
            "file://$(pwd)/about.html" \
            "file://$(pwd)/projects.html" \
            "file://$(pwd)/book.html"

      - name: 3️⃣ Start server + Lighthouse
        run: |
          npx http-server . -p 8080 -c-1 &
          SERVER_PID=$!
          sleep 5  # Wait for server
          lighthouse http://localhost:8080/index.html http://localhost:8080/book.html \
            --output html \
            --output-path ./lighthouse-report.html \
            --only-categories=performance,accessibility,seo \
            --chrome-flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --disable-background-timer-throttling --disable-backgrounding-occluded-windows --disable-renderer-backgrounding"
          kill $SERVER_PID || true
        continue-on-error: true

      - name: 4️⃣ Link checker (lychee)
        uses: lycheeverse/lychee-action@v1
        with:
          args: --no-progress './**/*.html'
